name: dev_marketplace
description: "سوق المطورين - منصة لبيع وشراء الأكواد البرمجية."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  google_fonts: ^8.2.1
  url_launcher: ^6.3.3
  shimmer: ^4.0.0
  qr_flutter: ^4.1.0
  http: ^1.6.0
  shared_preferences: ^2.5.6
  flutter_animate: ^4.5.2
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.3.3
  provider: ^6.1.5+1
  lottie: ^3.7.0
  cached_network_image: ^4.0.3
  image_picker: ^1.2.4
  firebase_storage: ^14.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # تعريف مجلد الأصول لكي يتعرف عليه التطبيق
  assets:
    - assets/app_icon.png

# إعدادات توليد الأيقونات
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/app_icon.png"
  # 👇 هذه الأسطر الثلاثة هي التي تمنع ضغط الأيقونة وتداخلها 👇
  adaptive_icon_background: "#0F172A" # لون الخلفية الداكنة للتطبيق
  adaptive_icon_foreground: "assets/app_icon.png"
  web:
    generate: true
    image_path: "assets/app_icon.png"